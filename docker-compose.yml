# Documents what a real deployment looks like (Postgres + Redis + the two
# services). Not required to run the project locally in this delivery —
# see README "Setup" and docs/product-decisions.md for why the local dev
# path uses SQLite and an in-process cache instead. Wiring this up for real
# is the natural next step: swap backend/src/common/db.ts's driver for a
# Postgres client and backend/src/marketdata/cache.ts for an ioredis client
# behind the same get/set/invalidate interface.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpulse_dev}
    ports:
      - "5432:5432"
    volumes:
      - marketpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://marketpulse:${POSTGRES_PASSWORD:-marketpulse_dev}@postgres:5432/marketpulse
      REDIS_URL: redis://redis:6379
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  marketpulse_pgdata:
